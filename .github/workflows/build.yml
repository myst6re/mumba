name: CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  create: null

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  main_build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        include:
          - os: ubuntu-latest
            name: linux64
            installer: deb
            pattern: target/debian/*.deb
          - os: windows-latest
            name: windows64
            installer: wix
            pattern: target/wix/*.msi
          - os: macos-latest
            name: macos-arm64
            installer: bundle
            pattern: target/release/bundle/osx/*.dmg

    steps:
    - uses: actions/checkout@v4

    - name: Install Wix3
      if: runner.os == 'Windows'
      run: |
        curl -LJO https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip
        7z x wix314-binaries.zip -o${{ github.workspace }}/wix

    - name: Install linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update -qqq || true
        sudo apt-get install -y -qqq -m mingw-w64 liblzma-dev dpkg-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libfontconfig-dev libssl-dev clang libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev libavdevice-dev libasound2-dev pkg-config qtbase5-dev libqt5svg5-dev || true

    - name: Install macos dependencies
      if: runner.os == 'macOS'
      run: brew install mingw-w64

    - run: rustup toolchain install stable --profile minimal

    - uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true

    - name: Check format
      run: cargo fmt --check

    - name: Build exe
      run: cargo build --release --all-features

    - name: Tests
      run: cargo test --release --all-features --tests --workspace

    - name: Build launcher
      if: runner.os != 'Windows'
      run: |
        rustup target add x86_64-pc-windows-gnu
        cargo build --release --all-features --bin ff8_launcher --target x86_64-pc-windows-gnu
        cp target/x86_64-pc-windows-gnu/release/ff8_launcher.exe resources/ff8_launcher.exe

    - name: Install cargo-${{ matrix.installer }}
      run: cargo install cargo-${{ matrix.installer }}

    - name: Get version
      shell: bash
      run: |
        version=$(cargo pkgid -p mumba | cut -d "@" -f2)
        if [ "$GITHUB_REF_TYPE" != tag ]; then
          version="${version}-continuous.$GITHUB_RUN_NUMBER"
        fi
        echo "MUMBA_VERSION=$version" >> $GITHUB_ENV

    - name: Build installer
      if: runner.os == 'Windows'
      shell: bash
      run: |
        cargo wix --no-build -p mumba --nocapture -o "target/wix/mumba-${MUMBA_VERSION}-setup-${{ matrix.name }}-english.msi" -i ${MUMBA_VERSION} --bin-path '${{ github.workspace }}/wix'
        cargo wix --no-build -p mumba --nocapture -o "target/wix/mumba-${MUMBA_VERSION}-setup-${{ matrix.name }}-francais.msi" -i ${MUMBA_VERSION} --bin-path '${{ github.workspace }}/wix' --culture fr-fr

    - name: Build installer
      if: runner.os == 'Linux'
      run: cargo deb --no-build -p mumba -o "target/debian/mumba-${MUMBA_VERSION}-${{ matrix.name }}.deb"

    - name: Build installer
      if: runner.os == 'macOS'
      run: cargo bundle --release -p mumba -f osx --binary-path target/release/mumba

    - name: Create zip
      if: runner.os == 'Windows'
      shell: bash
      run: |
        dir='${{ github.workspace }}'"/mumba-${MUMBA_VERSION}-${{ matrix.name }}"
        mkdir -p "$dir"
        cp target/release/mumba "$dir"
        cp target/release/ff8_launcher.exe "$dir/FF8_Launcher.exe"
        cp target/release/mmb "$dir"
        cp -r lang "$dir"
        cp gui/wix/License.rtf "$dir"
        cp resources/eax.dll "$dir"
        7z a '${{ github.workspace }}'"/mumba-${MUMBA_VERSION}-${{ matrix.name }}.zip" "$dir"

    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: artifact-${{ matrix.name }}
        path: ${{ github.workspace }}/${{ matrix.pattern }}

    - name: Upload zip
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: artifact-${{ matrix.name }}-zip
        path: ${{ github.workspace }}/mumba-*-${{ matrix.name }}.zip

  release_assets:
    name: Release
    needs:
    - main_build
    concurrency: release-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
    - name: Download Files
      uses: actions/download-artifact@v4

    - name: Deploy Package
      if: github.event.ref_type != 'tag' && github.ref == 'refs/heads/master'
      uses: crowbarmaster/GH-Automatic-Releases@latest
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag: "continuous"
        prerelease: true
        title: "Unstable Build"
        files: |
          artifact-*/*

    - name: Deploy Package
      if: github.event.ref_type == 'tag'
      uses: crowbarmaster/GH-Automatic-Releases@latest
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        prerelease: false
        title: ${{ github.event.ref }}
        files: |
          artifact-*/*
